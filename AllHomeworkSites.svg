<?xml version="1.0" encoding="UTF-8"?>
<!-- made with html to svg. open this file directly in a browser. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <title>OrangeesDev GitHub SVG Checker</title>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" title="OrangeesDev GitHub SVG Checker" style="display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:transparent" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; web-share; accelerometer; gyroscope" allowfullscreen="true" srcdoc="&lt;!doctype html&gt;&#10;&lt;html lang=&quot;en&quot;&gt;&#10;&lt;head&gt;&#10;&lt;meta charset=&quot;utf-8&quot;&gt;&#10;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&#10;&lt;title&gt;OrangeesDev GitHub SVG Checker&lt;/title&gt;&#10;&lt;style&gt;&#10;:root{color-scheme:dark;--bg:#15100c;--panel:#21170f;--line:#57351d;--orange:#ff861f;--light:#ffe7d0;--muted:#c0a38a}&#10;*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#3a210f 0,transparent 36%),var(--bg);color:var(--light);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}main{max-width:1050px;margin:auto;padding:32px 18px 60px}header{padding:10px 0 24px} .eyebrow{color:#ffb86d;text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;font-weight:800}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:.5rem 0}h1 span{color:var(--orange)}p{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.toolbar input{flex:1;min-width:220px}input,button{font:inherit;border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:#110d09;color:var(--light)}button{background:var(--orange);border-color:var(--orange);color:#201006;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:#ffd1a0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}.item{min-width:0;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#281b10,#1b130d);padding:16px}.item h2{font-size:1.05rem;overflow-wrap:anywhere;margin:0 0 6px}.path{font-size:.83rem;overflow-wrap:anywhere;color:var(--muted)}.preview{height:115px;background:#120e0a;border:1px solid #422a18;border-radius:10px;margin:12px 0;display:grid;place-items:center;overflow:hidden}.preview img{max-width:100%;max-height:100%;object-fit:contain}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#ffb86d;overflow-wrap:anywhere}.empty{border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:.85rem;color:var(--muted)}code{color:#ffd0a0;overflow-wrap:anywhere}&#10;&lt;/style&gt;&#10;&lt;/head&gt;&#10;&lt;body&gt;&lt;main&gt;&#10;&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Live repository scan · jsDelivr links&lt;/div&gt;&lt;h1&gt;Orangees&lt;span&gt;Dev&lt;/span&gt; SVG Checker&lt;/h1&gt;&lt;p&gt;Checks the public GitHub repository when this page opens and lists every SVG found in its current default branch.&lt;/p&gt;&lt;/header&gt;&#10;&lt;div class=&quot;toolbar&quot;&gt;&lt;input id=&quot;repo&quot; aria-label=&quot;GitHub repository&quot; value=&quot;OrangeesDev/MathWork&quot; placeholder=&quot;owner/repository&quot;&gt;&lt;button id=&quot;refresh&quot;&gt;Check GitHub now&lt;/button&gt;&lt;input id=&quot;filter&quot; aria-label=&quot;Filter SVGs&quot; placeholder=&quot;Filter SVG filenames…&quot;&gt;&lt;/div&gt;&#10;&lt;div id=&quot;status&quot; class=&quot;status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;Starting repository check…&lt;/div&gt;&#10;&lt;div id=&quot;results&quot; class=&quot;grid&quot;&gt;&lt;/div&gt;&#10;&lt;footer&gt;Uses GitHub's public API. No token is needed for public repositories. If GitHub rate-limits requests or the repository is private, the checker will show an error. jsDelivr links use the repository's current default branch.&lt;/footer&gt;&#10;&lt;/main&gt;&#10;&lt;script&gt;&#10;const statusEl=document.getElementById('status'), resultsEl=document.getElementById('results'), repoEl=document.getElementById('repo'), filterEl=document.getElementById('filter'), refreshBtn=document.getElementById('refresh');&#10;let allSvgs=[];&#10;function escapeHtml(s){return String(s).replace(/[&amp;&lt;&gt;&quot;']/g,c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[c]));}&#10;function render(){const q=filterEl.value.trim().toLowerCase();const files=allSvgs.filter(f=&gt;f.path.toLowerCase().includes(q));if(!files.length){resultsEl.innerHTML='&lt;div class=&quot;empty&quot;&gt;'+(allSvgs.length?'No SVG files match that filter.':'No SVG files found yet.')+'&lt;/div&gt;';return}resultsEl.innerHTML=files.map(f=&gt;{const name=f.path.split('/').pop();return `&lt;article class=&quot;item&quot;&gt;&lt;h2&gt;${escapeHtml(name)}&lt;/h2&gt;&lt;div class=&quot;path&quot;&gt;${escapeHtml(f.path)}&lt;/div&gt;&lt;div class=&quot;preview&quot;&gt;&lt;img loading=&quot;lazy&quot; alt=&quot;Preview of ${escapeHtml(name)}&quot; src=&quot;${escapeHtml(f.cdn)}&quot; onerror=&quot;this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','&lt;span class=&amp;quot;path&amp;quot;&gt;Preview unavailable&lt;/span&gt;')&quot;&gt;&lt;/div&gt;&lt;div class=&quot;links&quot;&gt;&lt;a href=&quot;${escapeHtml(f.cdn)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open CDN SVG&lt;/a&gt;&lt;a href=&quot;${escapeHtml(f.github)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GitHub file&lt;/a&gt;&lt;/div&gt;&lt;p&gt;&lt;button type=&quot;button&quot; class=&quot;copy&quot; data-url=&quot;${escapeHtml(f.cdn)}&quot;&gt;Copy jsDelivr URL&lt;/button&gt;&lt;/p&gt;&lt;/article&gt;`}).join('');resultsEl.querySelectorAll('.copy').forEach(b=&gt;b.addEventListener('click',async()=&gt;{try{await navigator.clipboard.writeText(b.dataset.url);b.textContent='Copied!'}catch{prompt('Copy this URL:',b.dataset.url)}}));}&#10;async function checkRepo(){const raw=repoEl.value.trim().replace(/^https?:\/\/(www\.)?github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');if(!/^[^/\s]+\/[^/\s]+$/.test(raw)){statusEl.textContent='Enter a repository as owner/repository.';return}refreshBtn.disabled=true;statusEl.textContent='Checking GitHub for '+raw+'…';resultsEl.innerHTML='';allSvgs=[];try{const headers={'Accept':'application/vnd.github+json'};const infoRes=await fetch('https://api.github.com/repos/'+raw,{headers,cache:'no-store'});if(!infoRes.ok)throw new Error(infoRes.status===404?'Repository not found or not public.':infoRes.status===403?'GitHub API rate limit reached. Try again later.':'GitHub returned HTTP '+infoRes.status);const info=await infoRes.json();const branch=info.default_branch;if(!branch)throw new Error('Could not determine the default branch.');const treeRes=await fetch('https://api.github.com/repos/'+raw+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1',{headers,cache:'no-store'});if(!treeRes.ok)throw new Error(treeRes.status===403?'GitHub API rate limit reached. Try again later.':'Could not read repository files (HTTP '+treeRes.status+').');const tree=await treeRes.json();if(tree.truncated)statusEl.textContent='Warning: GitHub truncated the file list for this large repository. Showing the SVGs returned.';allSvgs=(tree.tree||[]).filter(x=&gt;x.type==='blob'&amp;&amp;/\.svg$/i.test(x.path)).map(x=&gt;({path:x.path,cdn:'https://cdn.jsdelivr.net/gh/'+raw+'@'+branch+'/'+x.path.split('/').map(encodeURIComponent).join('/'),github:'https://github.com/'+raw+'/blob/'+branch+'/'+x.path.split('/').map(encodeURIComponent).join('/')})).sort((a,b)=&gt;a.path.localeCompare(b.path));if(!tree.truncated)statusEl.textContent=`Checked ${raw} · branch “${branch}” · ${allSvgs.length} SVG file${allSvgs.length===1?'':'s'} found.`;render()}catch(e){statusEl.textContent='Could not check repository: '+e.message;resultsEl.innerHTML='&lt;div class=&quot;empty&quot;&gt;Check your internet connection and confirm the repository is public. You can try again with the button above.&lt;/div&gt;'}finally{refreshBtn.disabled=false}}&#10;refreshBtn.addEventListener('click',checkRepo);filterEl.addEventListener('input',render);repoEl.addEventListener('keydown',e=&gt;{if(e.key==='Enter')checkRepo()});&#10;// Automatically check GitHub every time the HTML page is opened.&#10;window.addEventListener('DOMContentLoaded',checkRepo);if(document.readyState!=='loading')checkRepo();&#10;&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;&#10;"></iframe>
  </foreignObject>
</svg>
