<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Sim</title>
    <!-- Abstract gradient favicon – no symbols, no emojis -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23grad)'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0f0a1a;
            --surface: #1a1028;
            --surface2: #241836;
            --accent: #a855f7;
            --accent2: #6366f1;
            --gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2dff0;
            --text2: #b0a8c8;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas#particles {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1000;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .screen.active {
            display: flex;
        }
        #creation-screen {
            gap: 20px;
        }
        #creation-screen h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            background: linear-gradient(135deg, var(--accent), #c084fc, var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: -1px;
            text-align: center;
        }
        .subtitle {
            color: var(--text2);
            font-size: 1.1rem;
            text-align: center;
            max-width: 500px;
        }
        .card {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: var(--transition);
        }
        .card:hover {
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 0 20px 60px rgba(168, 85, 247, 0.15);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            font-family: inherit;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(168, 85, 247, 0.5);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-secondary:hover {
            background: #2d1f44;
            border-color: rgba(255, 255, 255, 0.25);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.82rem;
            border-radius: 30px;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            font-weight: 800;
        }
        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-width: 600px;
            width: 100%;
        }
        .genre-btn {
            padding: 14px 10px;
            border-radius: var(--radius-sm);
            background: var(--surface2);
            border: 2px solid transparent;
            color: var(--text);
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .genre-btn:hover {
            border-color: var(--accent);
            background: #2d1f44;
        }
        .genre-btn.selected {
            border-color: var(--accent);
            background: rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
        }
        #game-screen {
            display: none;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 1fr;
            gap: 16px;
            min-height: 100vh;
            padding: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }
        #game-screen.active {
            display: grid;
        }
        @media (max-width: 1100px) {
            #game-screen {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                gap: 12px;
                padding: 10px;
            }
            #game-screen .side-panel {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                max-height: none;
            }
            #game-screen .side-panel>* {
                flex: 1 1 140px;
                min-width: 120px;
            }
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(100vh - 32px);
            padding-right: 4px;
        }
        .side-panel::-webkit-scrollbar {
            width: 4px;
        }
        .side-panel::-webkit-scrollbar-thumb {
            background: var(--surface2);
            border-radius: 4px;
        }
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }
        .stat-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .value.small-val {
            font-size: 1.1rem;
        }
        .progress-bar-wrap {
            background: var(--surface2);
            border-radius: 20px;
            height: 8px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }
        .room-container {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .room-scene {
            width: 100%;
            height: 100%;
            min-height: 400px;
            position: relative;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .room-element {
            position: absolute;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
        }
        .room-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(to top, rgba(30, 20, 50, 0.9), rgba(30, 20, 50, 0.3));
            border-radius: 0;
        }
        .room-wall {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 30%;
            background: linear-gradient(180deg, #1a1030 0%, #1e1435 50%, #221838 100%);
            border-radius: 0;
        }
        .room-desk {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 8%;
            background: linear-gradient(180deg, #5c3d2e, #3d2217);
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .room-monitor {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 22%;
            height: 20%;
            background: linear-gradient(180deg, #2a2a3a, #1a1a28);
            border-radius: 8px 8px 4px 4px;
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.3);
        }
        .room-monitor::after {
            content: '';
            position: absolute;
            inset: 8%;
            background: linear-gradient(135deg, #1a1a3a, #0a0a20);
            border-radius: 3px;
        }
        .room-poster {
            position: absolute;
            top: 15%;
            right: 12%;
            width: 12%;
            height: 20%;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            border-radius: 3px;
            border: 2px solid #444;
            opacity: 0.6;
        }
        .room-bed {
            position: absolute;
            bottom: 22%;
            left: 5%;
            width: 20%;
            height: 10%;
            background: linear-gradient(180deg, #4a5568, #2d3748);
            border-radius: 10px 10px 4px 4px;
        }
        .room-award {
            position: absolute;
            top: 10%;
            right: 20%;
            width: 20px;
            height: 28px;
            background: linear-gradient(180deg, #ffd700, #b8860b);
            border-radius: 3px 3px 50% 50%;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .badge-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--surface2);
            color: var(--text2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .badge.gold-badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold);
            border-color: rgba(245, 158, 11, 0.4);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal h2 {
            margin-bottom: 16px;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text2);
            margin-bottom: 5px;
            font-weight: 700;
        }
        .modal select,
        .modal input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--surface2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .modal select:focus,
        .modal input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }
        .comment-item {
            padding: 8px 12px;
            background: var(--surface2);
            border-radius: 20px;
            margin: 4px 0;
            font-size: 0.82rem;
            animation: fadeIn 0.4s ease;
            border-left: 3px solid var(--accent);
        }
        .comment-item.troll {
            border-left-color: var(--red);
            opacity: 0.7;
        }
        .comment-item.positive {
            border-left-color: var(--green);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            padding: 14px 22px;
            border-radius: 50px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1), toastOut 0.4s 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }
        @keyframes toastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }
        .pulse {
            animation: pulse 0.5s ease;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }
        .shake {
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
        }
        .sponsor-card {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sponsor-tier-bronze {
            border-left: 3px solid #cd7f32;
        }
        .sponsor-tier-silver {
            border-left: 3px solid #c0c0c0;
        }
        .sponsor-tier-gold {
            border-left: 3px solid #ffd700;
        }
        .sponsor-tier-diamond {
            border-left: 3px solid #b9f2ff;
        }
        .leaderboard-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            margin: 4px 0;
            transition: var(--transition);
        }
        .leaderboard-row.player-row {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            font-weight: 700;
        }
        .leaderboard-rank {
            font-weight: 900;
            font-size: 1.2rem;
            width: 35px;
            text-align: center;
            color: var(--text2);
        }
        .leaderboard-rank.top3 {
            color: var(--gold);
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <!-- Channel Creation Screen -->
    <div id="creation-screen" class="screen active">
        <h1>Creator Sim</h1>
        <p class="subtitle">Start from nothing. Build your empire. One upload at a time.</p>
        <div class="card" style="max-width:650px;width:100%;">
            <h3 style="margin-bottom:12px;text-align:center;">Choose Your Niche</h3>
            <div class="genre-grid" id="genre-grid"></div>
            <div style="margin-top:16px;text-align:center;">
                <label style="display:block;margin-bottom:6px;color:var(--text2);font-size:0.85rem;">Channel Name</label>
                <input type="text" id="channel-name-input" placeholder="Enter channel name..." maxlength="30" style="width:100%;max-width:350px;padding:10px 16px;border-radius:50px;background:var(--surface2);border:1px solid rgba(255,255,255,0.1);color:var(--text);font-family:inherit;font-size:1rem;text-align:center;">
            </div>
            <div style="text-align:center;margin-top:18px;">
                <button class="btn btn-primary" id="start-btn" style="font-size:1.1rem;padding:14px 40px;">Start Creating 🚀</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <!-- Left Panel - Stats -->
        <div class="side-panel" id="left-panel">
            <div class="stat-card">
                <div class="label">📊 Subscribers</div>
                <div class="value" id="stat-subs">0</div>
                <div class="progress-bar-wrap"><div class="progress-bar-fill" id="subs-progress" style="width:0%"></div></div>
            </div>
            <div class="stat-card">
                <div class="label">👁️ Total Views</div>
                <div class="value small-val" id="stat-views">0</div>
            </div>
            <div class="stat-card">
                <div class="label">💰 Money</div>
                <div class="value small-val" id="stat-money">$0</div>
            </div>
            <div class="stat-card">
                <div class="label">⭐ Algorithm Score</div>
                <div class="value small-val" id="stat-algo">0</div>
                <div class="progress-bar-wrap"><div class="progress-bar-fill" id="algo-progress" style="width:0%"></div></div>
            </div>
            <div class="stat-card">
                <div class="label">😊 Audience Happiness</div>
                <div class="value small-val" id="stat-happiness">50%</div>
                <div class="progress-bar-wrap"><div class="progress-bar-fill" id="happiness-bar" style="width:50%;background:linear-gradient(90deg,#10b981,#34d399);"></div></div>
            </div>
            <button class="btn btn-primary btn-sm" id="upload-btn" style="width:100%;">📤 Upload Video</button>
            <button class="btn btn-secondary btn-sm" id="shop-btn" style="width:100%;">🛒 Equipment Shop</button>
            <button class="btn btn-secondary btn-sm" id="sponsors-btn" style="width:100%;">🤝 Sponsors</button>
            <button class="btn btn-secondary btn-sm" id="stream-btn" style="width:100%;">🔴 Go Live</button>
            <button class="btn btn-secondary btn-sm" id="leaderboard-btn" style="width:100%;">🏆 Leaderboard</button>
            <button class="btn btn-secondary btn-sm" id="save-btn" style="width:100%;">💾 Save Game</button>
            <button class="btn btn-sm" id="reset-btn" style="width:100%;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--text2);">🔄 Reset</button>
        </div>

        <!-- Center - Room -->
        <div class="room-container" id="room-container">
            <div class="room-scene" id="room-scene">
                <div class="room-wall"></div>
                <div class="room-floor"></div>
                <div class="room-bed" id="room-bed"></div>
                <div class="room-desk" id="room-desk"></div>
                <div class="room-monitor" id="room-monitor"></div>
                <div class="room-poster" id="room-poster"></div>
                <div id="room-extras"></div>
            </div>
        </div>

        <!-- Right Panel - Recent Activity -->
        <div class="side-panel" id="right-panel">
            <div class="stat-card">
                <div class="label">🎬 Last Video</div>
                <div id="last-video-info" style="font-size:0.8rem;color:var(--text2);">No videos yet</div>
            </div>
            <div class="stat-card">
                <div class="label">💬 Recent Comments</div>
                <div id="comments-display" style="max-height:200px;overflow-y:auto;font-size:0.8rem;"></div>
            </div>
            <div class="stat-card">
                <div class="label">🏅 Awards</div>
                <div class="badge-row" id="awards-display"></div>
            </div>
            <div class="stat-card">
                <div class="label">📈 Milestones</div>
                <div id="milestones-display" style="font-size:0.75rem;color:var(--text2);max-height:120px;overflow-y:auto;"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== GAME STATE ====================
            const defaultState = () => ({
                channelName: '',
                niche: '',
                subscribers: 0,
                totalViews: 0,
                money: 0,
                watchTime: 0,
                likes: 0,
                dislikes: 0,
                algorithmScore: 25,
                audienceHappiness: 50,
                uploadConsistency: 0,
                sponsorReputation: 0,
                uploadCount: 0,
                lastUploadDay: -1,
                currentDay: 0,
                equipment: {
                    microphone: 'bad',
                    camera: 'none',
                    lighting: 'none',
                    pc: 'old_laptop',
                    editingSoftware: 'basic',
                    editor: 'none',
                    thumbnailDesigner: 'none',
                    studio: 'bedroom',
                    greenScreen: false,
                    internet: 'slow',
                    secondMonitor: false,
                    soundPanels: false,
                    streamingSetup: false,
                    office: 'none',
                    warehouseStudio: false,
                },
                equipmentLevel: 0,
                roomLevel: 0,
                awards: [],
                milestonesReached: [],
                sponsorships: [],
                activeSponsor: null,
                viralEventCooldown: 0,
                lastCommentSet: [],
                commentIndexOffset: 0,
            });

            let state = defaultState();

            // ==================== GENRES ====================
            const genres = [
                'Gaming', 'Technology', 'Movies', 'Music', 'Comedy', 'Education', 'Animation',
                'Science', 'Lifestyle', 'Cooking', 'Sports', 'Reviews', 'Horror', 'Storytelling',
                'News', 'Art', 'Programming', 'Travel', 'Cars', 'Memes'
            ];

            const nicheTopics = {
                'Gaming': ['Minecraft', 'Roblox', 'Fortnite', 'Racing', 'Simulation', 'RPG Review', 'Speedrun',
                    'E-Sports', 'Indie Games', 'Retro Gaming'
                ],
                'Technology': ['New Smartphone', 'Laptop Review', 'AI Tools', 'Coding Tips', 'Gadget Unboxing',

            // ==================== SOUND ENGINE ====================
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playTone(freq, duration, type = 'sine', vol = 0.08) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) { /* silent */ }
            }

            function sfxClick() { playTone(800, 0.08, 'sine', 0.04);
                playTone(1000, 0.06, 'sine', 0.03); }

            // ==================== PARTICLES ====================
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function spawnParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x,
                        y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8 - 4,
                        life: 1,
                        decay: 0.015 + Math.random() * 0.04,
                        size: 3 + Math.random() * 8,
                        color,
                    });
                }
            }

            function spawnConfetti(count = 80) {
                const colors = ['#a855f7', '#f59e0b', '#10b981', '#ef4444', '#6366f1', '#ec4899', '#06b6d4',
                '#f97316'];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: -30 - Math.random() * 100,
                        vx: (Math.random() - 0.5) * 6,
                        vy: 3 + Math.random() * 7,
                        life: 1,
                        decay: 0.006 + Math.random() * 0.015,
                        size: 4 + Math.random() * 10,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rot: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.3,
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15;
                    p.life -= p.decay;
                    if (p.rot !== undefined) p.rot += (p.rotSpeed || 0);
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (const p of particles) {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    if (p.rot !== undefined) {
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    } else {
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            function particleLoop() {
                updateParticles();
                drawParticles();
                requestAnimationFrame(particleLoop);
            }
            particleLoop();

                if (eq.editingSoftware === 'pro') score += 8;
                if (eq.editor === 'freelancer') score += 6;
                if (eq.editor === 'professional') score += 14;
                if (eq.thumbnailDesigner === 'freelancer') score += 5;
                if (eq.thumbnailDesigner === 'professional') score += 10;
                if (eq.greenScreen) score += 4;
                if (eq.internet === 'fast') score += 3;
                if (eq.internet === 'fiber') score += 7;
                if (eq.secondMonitor) score += 3;
                if (eq.soundPanels) score += 4;
                if (eq.streamingSetup) score += 5;
                if (eq.office === 'office') score += 6;
                if (eq.office === 'studio_space') score += 12;
                if (eq.warehouseStudio) score += 20;
                return score;
            }

            function getRoomLevelFromEquipment() {
                const eq = state.equipment;
                let lvl = 0;
                if (eq.pc !== 'old_laptop' || eq.microphone !== 'bad') lvl = Math.max(lvl, 1);
                if (eq.pc === 'gaming_pc' && eq.microphone !== 'bad' && eq.camera !== 'none') lvl = Math.max(lvl, 2);
                if (eq.pc === 'pro_pc' && eq.camera !== 'none' && eq.lighting !== 'none' && eq.editor !== 'none')
                    lvl = Math.max(lvl, 3);
                if (eq.office === 'studio_space' && eq.greenScreen && eq.soundPanels) lvl = Math.max(lvl, 4);
                if (eq.warehouseStudio) lvl = 5;
                return lvl;
            }

            // ==================== VIDEO UPLOAD LOGIC ====================
            function getAvailableTopics() {
                const niche = state.niche;
                const onNiche = nicheTopics[niche] || nicheTopics['Gaming'];
                const allTopics = [...onNiche];
                // Add some off-niche options
                if (Math.random() < 0.3) {
                    allTopics.push(offNicheTopics[Math.floor(Math.random() * offNicheTopics.length)]);
                }
                return allTopics;
            }

            function simulateUpload(topic, length, thumbnailQuality, editingQuality, uploadTime, effort, titleStyle) {
                const eqScore = getEquipmentScore();
                const isOnNiche = (nicheTopics[state.niche] || []).includes(topic) ||
                    (nicheTopics[state.niche] || []).some(t => topic.toLowerCase().includes(t.toLowerCase()));

                let baseViews = 50 + Math.random() * 200;
                let viralChance = 0.02;
                let flopChance = 0.15;

                // Niche match
                if (isOnNiche) {
                    baseViews *= 2.5;
                    viralChance += 0.05;
                    flopChance -= 0.08;
                } else {
                    baseViews *= 0.3;
                    viralChance = 0;
                    flopChance += 0.35;
                    state.audienceHappiness -= 8 + Math.random() * 10;
                }

                // Equipment
                baseViews *= (1 + eqScore / 40);

                // Thumbnail
                if (thumbnailQuality === 'high') baseViews *= 1.6;
                if (thumbnailQuality === 'low') baseViews *= 0.7;

                // Editing
                if (editingQuality === 'high') baseViews *= 1.5;
                if (editingQuality === 'low') baseViews *= 0.75;

                // Effort
                if (effort === 'high') { baseViews *= 1.4;
                    viralChance += 0.03; }
                if (effort === 'low') { baseViews *= 0.5;
                    flopChance += 0.2; }

                // Upload time bonus
                if (uploadTime === 'peak') baseViews *= 1.2;

                // Title style
                if (titleStyle === 'clickbait') { baseViews *= 1.3;
                    state.audienceHappiness -= 3; }
                if (titleStyle === 'boring') baseViews *= 0.8;

                // Algorithm score influence
                baseViews *= (0.5 + state.algorithmScore / 80);

                // Subscriber base bonus
                baseViews += state.subscribers * (0.02 + Math.random() * 0.08);

                // Random variance
                baseViews *= (0.4 + Math.random() * 1.6);

                // Viral check
                let isViral = false;
                if (Math.random() < viralChance) {
                    baseViews *= 5 + Math.random() * 20;
                    isViral = true;
                }

                // Flop check
                let isFlop = false;
                if (Math.random() < flopChance && !isViral) {
                    baseViews *= 0.1 + Math.random() * 0.3;
                    isFlop = true;
                }

                const views = Math.max(10, Math.floor(baseViews));
                const ctr = clamp(2 + Math.random() * 12 + (isViral ? 10 : 0) - (isFlop ? 5 : 0), 0.5, 25);
                const watchTimePerView = 0.3 + Math.random() * 0.7;
                const totalWatchTime = views * watchTimePerView;
                const likes = Math.floor(views * (0.03 + Math.random() * 0.08));
                const dislikes = Math.floor(views * (0.002 + Math.random() * 0.015));
                const comments = Math.floor(views * (0.005 + Math.random() * 0.02));
                const newSubs = Math.floor(views * (0.005 + Math.random() * 0.03) * (isOnNiche ? 1.5 : 0.4));
                const revenue = views * (0.0005 + Math.random() * 0.004) + (state.sponsorReputation > 0 ? state
                    .sponsorReputation * views * 0.0002 : 0);

                return {
                    views,
                    ctr,
                    totalWatchTime,
                    likes,
                    dislikes,
                    comments,
                    newSubs,
                    revenue,
                    isViral,
                    isFlop,
                    isOnNiche,
                    topic,
                };
            }

            function getRandomComments(count, sentiment = 'mixed') {
                const pool = [...commentPool];
                // Shuffle
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                const selected = pool.slice(0, Math.min(count, pool.length));
                state.lastCommentSet = selected;
                state.commentIndexOffset = (state.commentIndexOffset + count) % commentPool.length;
                return selected;
            }

            function processUpload(topic, length, thumbnailQuality, editingQuality, uploadTime, effort, titleStyle) {
                initAudio();
                const result = simulateUpload(topic, length, thumbnailQuality, editingQuality, uploadTime, effort,
                    titleStyle);

                state.totalViews += result.views;
                state.watchTime += result.totalWatchTime;
                state.likes += result.likes;
                state.dislikes += result.dislikes;
                state.subscribers += result.newSubs;
                state.money += result.revenue;
                state.uploadCount++;
                state.lastUploadDay = state.currentDay;
                state.uploadConsistency = Math.min(100, state.uploadConsistency + 5);
                state.algorithmScore = clamp(state.algorithmScore + (result.isViral ? 15 : result.isFlop ? -8 : 2), 0,
                100);
                state.audienceHappiness = clamp(state.audienceHappiness + (result.isOnNiche ? 3 : -8) + (result.isViral ?
                    10 : 0) - (result.isFlop ? 5 : 0), 5, 100);
                state.viralEventCooldown = Math.max(0, state.viralEventCooldown - 1);

                // Random events
                checkRandomEvents(result);

                // Update room
                const newRoomLevel = getRoomLevelFromEquipment();
                if (newRoomLevel !== state.roomLevel) {
                    state.roomLevel = newRoomLevel;
                    updateRoom();
                    showToast(`🏠 Room upgraded! New environment unlocked.`, 'success');
                }

                // Check milestones
                checkMilestones();

                // Update displays
                updateStatsDisplay();
                updateAwardsDisplay();
                updateMilestonesDisplay();

                // Display comments
                const commentCount = Math.min(8, result.comments);
                const commentList = getRandomComments(commentCount, result.isFlop ? 'negative' : 'mixed');
                displayComments(commentList);

                // Update last video info
                $('last-video-info').innerHTML = `
              <strong>${topic}</strong><br>
              Views: ${formatNumber(result.views)}<br>
              Likes: ${formatNumber(result.likes)} | CTR: ${result.ctr.toFixed(1)}%<br>
              ${result.isViral ? '🔥 VIRAL!' : result.isFlop ? '💔 Flopped' : '📈 Normal'}
            `;

                // Effects
                if (result.isViral) {
                    spawnConfetti(120);
                    sfxMilestone();
                    showToast('🔥 YOUR VIDEO WENT VIRAL!', 'gold');
                } else if (result.isFlop) {
                    sfxFail();
                    showToast('😔 This one didn\'t land...', 'error');
                } else {
                    sfxSuccess();
                    if (result.revenue > 10) sfxCash();
                }

                // Sponsor reputation grows slowly
                if (state.subscribers > 100) {
                    state.sponsorReputation = Math.min(100, state.sponsorReputation + 0.5 + Math.random());
                }

                return result;
            }

                    const bad = badEvents[Math.floor(Math.random() * badEvents.length)];
                    bad.effect();
                    showToast(bad.msg, 'error');
                    sfxFail();
                }

                // Sponsor event
                if (state.sponsorReputation > 15 && Math.random() < 0.08 && !state.activeSponsor && state.subscribers >
                    500) {
                    generateSponsorOffer();
                }

            // ==================== SPONSORS ====================
            function generateSponsorOffer() {
                const tiers = [
                    { name: 'Local Startup', tier: 'bronze', pay: 200 + Math.random() * 800, repReq: 10,
                        trustImpact: 1 },
                    { name: 'Online Retailer', tier: 'silver', pay: 800 + Math.random() * 2000, repReq: 25,
                        trustImpact: -2 },
                    { name: 'Tech Brand', tier: 'gold', pay: 2000 + Math.random() * 6000, repReq: 40,
                    trustImpact: -3 },
                    { name: 'Major Corporation', tier: 'diamond', pay: 8000 + Math.random() * 20000, repReq: 60,
                        trustImpact: -6 },
                ];
                const available = tiers.filter(t => state.sponsorReputation >= t.repReq);
                if (available.length === 0) return;
                const offer = available[Math.floor(Math.random() * available.length)];
                const sponsorship = {
                    id: Date.now(),
                    name: offer.name,
                    tier: offer.tier,
                    pay: Math.floor(offer.pay),
                    trustImpact: offer.trustImpact,
                    duration: 3 + Math.floor(Math.random() * 7),
                    accepted: false,
                };
                state.sponsorships.push(sponsorship);
                if (state.sponsorships.length > 10) state.sponsorships.shift();
                showToast(`🤝 New sponsor offer: ${offer.name} - ${formatMoney(sponsorship.pay)}`, 'gold');
            }

            function acceptSponsor(id) {
                const sponsor = state.sponsorships.find(s => s.id === id);
                if (!sponsor || sponsor.accepted) return;
                sponsor.accepted = true;
                state.activeSponsor = sponsor;
                state.money += sponsor.pay;
                state.sponsorReputation += 5;
                state.audienceHappiness += sponsor.trustImpact;
                showToast(`✅ Accepted ${sponsor.name}! ${formatMoney(sponsor.pay)} earned.`, 'success');
                sfxCash();
                updateStatsDisplay();
            }

            function rejectSponsor(id) {
                const sponsor = state.sponsorships.find(s => s.id === id);
                if (!sponsor) return;
                state.sponsorships = state.sponsorships.filter(s => s.id !== id);
                state.sponsorReputation = Math.max(0, state.sponsorReputation - 2);
                showToast(`❌ Rejected ${sponsor.name}.`, 'error');
            }

                const baseViewers = Math.floor(state.subscribers * (0.01 + Math.random() * 0.05));

                const viewers = baseViewers * streamQuality;
                const donations = viewers * (0.1 + Math.random() * 0.5);
                const newSubs = Math.floor(viewers * (0.02 + Math.random() * 0.06));
                const revenue = donations + viewers * 0.02;

                state.money += revenue;
                state.subscribers += newSubs;
                state.totalViews += viewers * 3;
                state.algorithmScore = clamp(state.algorithmScore + 3, 0, 100);
                state.audienceHappiness = clamp(state.audienceHappiness + 4, 0, 100);

                            const newRoomLevel = getRoomLevelFromEquipment();
                            if (newRoomLevel !== state.roomLevel) {
                                state.roomLevel = newRoomLevel;
                                updateRoom();
                                showToast('🏠 Room environment upgraded!', 'success');
                            }
                            updateRoom();
                            updateStatsDisplay();
                            sfxCash();
                            showToast(`✅ Purchased upgrade!`, 'success');
                            modal.remove();
                            showShopModal(); // Refresh
                        }
                    });
                });
            }

            function showSponsorsModal() {
                initAudio();
                let content = '<div style="max-height:300px;overflow-y:auto;">';
                if (state.sponsorships.length === 0) {
                    content += '<p style="color:var(--text2);">No sponsor offers yet. Keep growing!</p>';
                } else {
                    state.sponsorships.forEach(s => {
                        const tierClass = 'sponsor-tier-' + s.tier;
                        content += `
                  <div class="sponsor-card ${tierClass}">
                    <div>
                      <strong>${s.name}</strong> <span class="badge">${s.tier.toUpperCase()}</span><br>
                      <small>${formatMoney(s.pay)} | Trust impact: ${s.trustImpact>0?'+':''}${s.trustImpact}</small>
                    </div>
                    <div>
                      ${s.accepted ? '<span class="badge gold-badge">Accepted</span>' : `
                        <button class="btn btn-sm btn-primary accept-sponsor" data-id="${s.id}">Accept</button>
                        <button class="btn btn-sm btn-danger reject-sponsor" data-id="${s.id}" style="margin-left:4px;">Reject</button>
                      `}
                    </div>
                  </div>
                `;
                    });
                }
                content += '</div>';
                content +=
                    '<p style="font-size:0.75rem;color:var(--text2);margin-top:8px;">Sponsor Reputation: ' + Math.floor(
                        state.sponsorReputation) + '/100</p>';

                const modal = showModal('🤝 Sponsors', content);
                modal.querySelectorAll('.accept-sponsor').forEach(btn => {
                    btn.addEventListener('click', () => {
                        acceptSponsor(parseInt(btn.dataset.id));
                        modal.remove();
                        showSponsorsModal();
                    });
                });
                modal.querySelectorAll('.reject-sponsor').forEach(btn => {
                    btn.addEventListener('click', () => {
                        rejectSponsor(parseInt(btn.dataset.id));
                        modal.remove();
                        showSponsorsModal();
                    });
                });
            }

            function showLeaderboardModal() {
                const lb = getLeaderboard();
                let content = '<div style="max-height:400px;overflow-y:auto;">';
                lb.forEach((creator, i) => {
                    const rank = i + 1;
                    const rankClass = rank <= 3 ? ' top3' : '';
                    const isPlayer = creator.isPlayer;
                    content += `
                <div class="leaderboard-row${isPlayer?' player-row':''}">
                  <span class="leaderboard-rank${rankClass}">#${rank}</span>
                  <span style="flex:1;font-weight:${isPlayer?'800':'500'};">${creator.name}</span>
                  <span style="color:var(--text2);font-size:0.8rem;">${creator.niche}</span>
                  <span style="font-weight:700;margin-left:8px;">${formatNumber(creator.subs)} subs</span>
                </div>
              `;
                });
                content += '</div>';
                showModal('🏆 Creator Leaderboard', content);
            }

            function showStreamModal() {
                initAudio();
                if (state.subscribers < 100) {
                    showToast('Need at least 100 subscribers to go live.', 'error');
                    return;
                }
                const content = `
              <p>Go live to your audience!</p>
              <p style="color:var(--text2);">Estimated viewers: ~${formatNumber(Math.floor(state.subscribers * (0.01 + Math.random() * 0.05)))}</p>
              <p style="color:var(--text2);">Streaming setup: ${state.equipment.streamingSetup ? '✅ Ready' : '⚠️ Basic'}</p>
              <button class="btn btn-primary" id="start-stream-btn" style="width:100%;margin-top:12px;">🔴 Start Streaming</button>
            `;
                const modal = showModal('🔴 Go Live', content);
                modal.querySelector('#start-stream-btn').addEventListener('click', () => {
                    modal.remove();
                    simulateStream();
                    saveGame();
                });
            }

            // ==================== SAVE / LOAD ====================
            function saveGame() {
                try {
                    localStorage.setItem('creatorSim_save', JSON.stringify(state));
                    showToast('💾 Game saved!', 'success');
                } catch (e) {
                    showToast('Failed to save.', 'error');
                }
            }

            function loadGame() {
                try {
                    const data = localStorage.getItem('creatorSim_save');
                    if (data) {
                        const parsed = JSON.parse(data);
                        // Merge with defaults to handle new fields
                        state = { ...defaultState(), ...parsed };
                        state.equipment = { ...defaultState().equipment, ...(parsed.equipment || {}) };
                        return true;
                    }
                } catch (e) { /* corrupted save */ }
                return false;
            }

            function resetGame() {
                if (confirm('Reset all progress? This cannot be undone.')) {
                    state = defaultState();
                    localStorage.removeItem('creatorSim_save');
                    updateAllUI();
                    showToast('🔄 Game reset.', 'error');
                    switchToCreationScreen();
                }
            }

            // ==================== UI UPDATE ====================
            function updateAllUI() {
                updateStatsDisplay();
                updateRoom();
                updateAwardsDisplay();
                updateMilestonesDisplay();
                $('last-video-info').innerHTML = state.uploadCount === 0 ? 'No videos yet' :
                    `${state.uploadCount} videos uploaded`;
                $('comments-display').innerHTML = state.lastCommentSet.length > 0 ?
                    state.lastCommentSet.map(c => `<div class="comment-item ${c.type==='troll'?'troll':c.type==='positive'?'positive':''}">${c.text}</div>`)
                    .join('') :
                    '<span style="color:var(--text2);">Upload a video to see comments</span>';
                $('channel-name-input').value = state.channelName;
                if (state.niche && state.channelName) {
                    document.querySelectorAll('.genre-btn').forEach(b => {
                        b.classList.toggle('selected', b.dataset.genre === state.niche);
                    });
                }
            }

            function switchToGameScreen() {
                $('creation-screen').classList.remove('active');
                $('game-screen').classList.add('active');
                updateAllUI();
            }

            function switchToCreationScreen() {
                $('game-screen').classList.remove('active');
                $('creation-screen').classList.add('active');
            }

            // ==================== EVENT HANDLERS ====================
            function initGenreGrid() {
                const grid = $('genre-grid');
                grid.innerHTML = genres.map(g =>
                    `<button class="genre-btn" data-genre="${g}">${g}</button>`
                ).join('');
                grid.querySelectorAll('.genre-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        initAudio();
                        sfxClick();
                        grid.querySelectorAll('.genre-btn').forEach(b => b.classList.remove(
                            'selected'));
                        btn.classList.add('selected');
                        state.niche = btn.dataset.genre;
                    });
                });
            }

            $('start-btn').addEventListener('click', () => {
                initAudio();
                sfxClick();
                const name = $('channel-name-input').value.trim();
                if (!name) { showToast('Enter a channel name!', 'error'); return; }
                if (!state.niche) { showToast('Choose a niche!', 'error'); return; }
                state.channelName = name;
                switchToGameScreen();
                saveGame();
                showToast(`Welcome, ${name}! Start uploading to grow your channel.`, 'success');
                spawnConfetti(30);
            });

            $('upload-btn').addEventListener('click', () => { initAudio();
                sfxClick();
                showUploadModal(); });
            $('shop-btn').addEventListener('click', () => { initAudio();
                sfxClick();
                showShopModal(); });
            $('sponsors-btn').addEventListener('click', () => { initAudio();
                sfxClick();
                showSponsorsModal(); });
            $('stream-btn').addEventListener('click', () => { initAudio();
                sfxClick();
                showStreamModal(); });
            $('leaderboard-btn').addEventListener('click', () => { initAudio();
                sfxClick();
                showLeaderboardModal(); });
            $('save-btn').addEventListener('click', () => { initAudio();
                sfxClick();
                saveGame(); });
            $('reset-btn').addEventListener('click', () => { initAudio();
                sfxClick();
                resetGame(); });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'u' && e.ctrlKey) { e.preventDefault();
                    showUploadModal(); }
                if (e.key === 's' && e.ctrlKey) { e.preventDefault();
                    saveGame(); }
            });

            // ==================== INIT ====================
            function init() {
                initGenreGrid();
                const loaded = loadGame();
                if (loaded && state.channelName && state.niche && state.uploadCount >= 0) {
                    switchToGameScreen();
                    showToast(`Welcome back, ${state.channelName}!`, 'success');
                } else {
                    state = defaultState();
                    switchToCreationScreen();
                }
                updateAllUI();
            }

            // Auto-save every 60 seconds
            setInterval(() => {
                if (state.channelName && state.niche && $('game-screen').classList.contains('active')) {
                    saveGame();
                }
            }, 60000);

            // Passive income / decay
            setInterval(() => {
                if ($('game-screen').classList.contains('active') && state.subscribers > 0) {
                    // Slight passive growth
                    if (state.uploadConsistency > 30 && state.audienceHappiness > 40) {
                        const passiveSubs = Math.floor(state.subscribers * 0.0001);
                        state.subscribers += passiveSubs;
                        state.totalViews += passiveSubs * 5;
                    }
                    // Decay if inactive
                    if (state.currentDay - state.lastUploadDay > 7 && state.lastUploadDay >= 0) {
                        state.audienceHappiness -= 1;
                        state.algorithmScore -= 0.5;
                        state.uploadConsistency -= 2;
                    }
                    state.audienceHappiness = clamp(state.audienceHappiness, 5, 100);
                    state.algorithmScore = clamp(state.algorithmScore, 0, 100);
                    state.uploadConsistency = clamp(state.uploadConsistency, 0, 100);
                    updateStatsDisplay();
                    checkMilestones();
                }
            }, 15000);

            init();
            console.log('🎬 Creator Sim ready!');
            console.log('📤 Click "Upload Video" to start your journey.');
            console.log('💡 Tips: Stay on-niche, upgrade equipment, and watch for viral moments!');
        })();
    </script>
</body>
</html>
